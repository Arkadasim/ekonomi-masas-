<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ekonomi Masası</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1 class="header-title">EKONOMİ MASASI 📈</h1>
    </div>

    <div class="ozet">
        <div class="buyuk-kart">
            <div id="net-bakiye" class="kalan-tutar">0 TL</div>
            <div style="color: #666; font-size: 12px; margin-top: 10px; letter-spacing: 2px;">KULLANILABİLİR BAKİYE</div>
        </div>

        <div class="gelir-alani">
            <input type="number" id="bakiye-input" placeholder="Gelir Miktarı" onkeydown="if(event.key==='Enter') setBakiye()">
            <button onclick="setBakiye()" class="set-et-btn">SET ET</button>
        </div>

        <div class="kucuk-kartlar">
            <div class="kucuk-kart">
                <div class="label">Toplam Yatırım</div>
                <div id="toplam-yatirim" class="deger-yesil">0 TL</div>
            </div>
            <div class="kucuk-kart">
                <div class="label">Toplam Gider</div>
                <div id="toplam-gider" class="deger-kirmizi">0 TL</div>
            </div>
        </div>

        <div class="sekmeler">
            <button id="sekme-harcama" class="sekme active" onclick="sekmeDegistir('harcama')">HARCAMALAR</button>
            <button id="sekme-yatirim" class="sekme" onclick="sekmeDegistir('yatirim')">YATIRIMLAR</button>
        </div>

        <div id="islem-listesi"></div>
    </div>

    <div class="giris-paneli">
        <div class="input-row">
            <input type="text" id="islem-aciklama" placeholder="Açıklama">
            <input type="number" id="islem-miktar" placeholder="Miktar (TL)" onkeydown="if(event.key==='Enter') islemEkle()">
        </div>
        <button id="btn-kaydet-islem" class="btn-kaydet harcama-modu" onclick="islemEkle()">－ HARCAMAYI KAYDET</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
